reading: >-
  Reading the police feeds to find relevant releases, keeping them privately and writing our own
  short alert for parents is editorial use. Republishing the release text automatically on our
  site would need news aktuell's approval, so the teaser stays protected_text and is never
  exported; an export, if any, is title, dates, city and the link. The press releases themselves
  come from the police (public authority).
