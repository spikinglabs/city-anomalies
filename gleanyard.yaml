# Project settings; every key is optional. See https://kausalflow.github.io/gleanyard/
schema_version: 1
user_agent: "city-anomalies (+https://github.com/spikinglabs/city-anomalies)"   # say who you are; add a contact URL
excluded_hosts: []        # hosts research must not propose
dataherb:                 # list this project in a DataHerb catalog (https://dataherb.github.io); delete to turn off
  id: "city-anomalies"
  name: Disruptions in big German cities
  description: >-
    Announced demonstrations and marches, large police operations, bomb defusals with
    evacuations, transit strikes and closures in Köln, Berlin, München, Hamburg, Frankfurt am
    Main and Düsseldorf, collected daily from official sources (police press releases and
    assembly lists). Facts only, with a link to the official page.
  tags: [cities, germany, demonstrations, police, transit, alerts]
  owner: spikinglabs
  license: CC-BY-4.0     # licence of the export (dataherb.json)
  expected_interval: P1D  # how often collect runs; the catalog flags the data as stale after this
